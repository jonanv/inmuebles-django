<button
  (click)="onToggleSpinner()">
  Toggle Spinner
</button>

@if (showSpinner) {
  <app-spinner />
}

<button
  appFilesUpload
  [multiple]="true"
  (changed)="onFilesChanged($event)"
>
  Subir imagenes al servidor
</button>

<button
  (click)="onError()">
  Error
</button>

<button
  (click)="onSuccess()">
  Success
</button>
