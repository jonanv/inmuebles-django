@if (loading$ | async) {
  <app-spinner></app-spinner>
}

<section fxLayoutAlign="center">

  <mat-card>

    <form
      fxLayout="column"
      fxLayouAlign="center center"
      fxLayoutGap="10px"
      #form="ngForm"
      (ngSubmit)="onLogin(form)">
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>
          <input
            matInput
            type="text"
            name="email"
            placeholder="E-mail"
            ngModel
            required>
          <mat-error>Debe ingresar un e-mail</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            type="password"
            name="password"
            placeholder="Contraseña"
            ngModel
            required>
            <mat-error>Debe ingresar una contraseña</mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit">
          Login
        </button>
    </form>

  </mat-card>

</section>
